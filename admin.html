        function ManualSendView() {
            const [email, setEmail] = useState("");
            const [phone, setPhone] = useState("");
            const [subject, setSubject] = useState("Construction Estimation Master Toolkit - Information");
            const [message, setMessage] = useState("");
            const [sending, setSending] = useState(false);
            const [feedback, setFeedback] = useState(null);

            const handleSendEmail = async () => {
                if (!email || !message) {
                    setFeedback({ type: "error", msg: "Please provide an email address and message body." });
                    return;
                }
                setSending(true);
                setFeedback(null);
                try {
                    const resp = await fetch("/api/send-email", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ to: email, subject: subject, html: `<div style="font-family: -apple-system, sans-serif; padding: 24px; color: #1d1d1f; max-width: 600px; margin: 0 auto; line-height: 1.6;">${message}</div>` })
                    });
                    const resData = await resp.json();
                    if (resp.ok) {
                        setFeedback({ type: "success", msg: "Email delivered successfully via Resend API!" });
                        setMessage("");
                    } else {
                        throw new Error(resData.message || "Failed to send email.");
                    }
                } catch(e) {
                    setFeedback({ type: "error", msg: "Error: " + e.message });
                } finally {
                    setSending(false);
                }
            };

            const handleWhatsApp = () => {
                if (!phone) {
                    setFeedback({ type: "error", msg: "Please enter a customer phone number." });
                    return;
                }
                const clean = phone.replace(/[^0-9]/g, "");
                const waUrl = `https://wa.me/${clean}?text=${encodeURIComponent(message)}`;
                window.open(waUrl, "_blank");
            };

            return (
                <div className="space-y-6 max-w-3xl">
                    <div className="flex items-center justify-between">
                        <div>
                            <h1 className="text-2xl font-bold text-[#1d1d1f] tracking-tight">Manual Dispatch</h1>
                            <p className="text-sm text-slate-500 mt-1">Send transactional emails via Resend API or initiate direct customer WhatsApp conversations.</p>
                        </div>
                    </div>

                    <div className="glass-card rounded-3xl p-7 apple-transition">
                        {feedback && (
                            <div className={`p-4 rounded-2xl text-xs font-medium mb-6 flex items-center gap-2 apple-transition ${feedback.type === "success" ? "bg-emerald-500/10 text-emerald-700 border border-emerald-500/20" : "bg-rose-500/10 text-rose-700 border border-rose-500/20"}`}>
                                <span className="material-symbols-outlined text-base">{feedback.type === "success" ? "check_circle" : "error"}</span>
                                {feedback.msg}
                            </div>
                        )}

                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1.5 uppercase tracking-wider">Customer Email</label>
                                    <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="customer@example.com" className="w-full apple-input rounded-xl px-3.5 py-2.5 text-sm text-slate-900" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1.5 uppercase tracking-wider">Customer Phone</label>
                                    <input type="text" value={phone} onChange={e => setPhone(e.target.value)} placeholder="919902011600" className="w-full apple-input rounded-xl px-3.5 py-2.5 text-sm text-slate-900" />
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-700 mb-1.5 uppercase tracking-wider">Subject (Email)</label>
                                <input type="text" value={subject} onChange={e => setSubject(e.target.value)} className="w-full apple-input rounded-xl px-3.5 py-2.5 text-sm text-slate-900" />
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-700 mb-1.5 uppercase tracking-wider">Message Body</label>
                                <textarea rows="6" value={message} onChange={e => setMessage(e.target.value)} placeholder="Write your message here..." className="w-full apple-input rounded-xl px-3.5 py-2.5 text-sm text-slate-900 resize-none"></textarea>
                            </div>

                            <div className="flex flex-wrap gap-3 pt-3">
                                <button onClick={handleSendEmail} disabled={sending} className="bg-[#0071e3] hover:bg-[#0077ed] active:scale-[0.98] text-white font-medium text-sm px-5 py-2.5 rounded-full shadow-sm transition-all flex items-center gap-2">
                                    <span className="material-symbols-outlined text-base">send</span>
                                    {sending ? "Sending Email..." : "Send Email via Resend"}
                                </button>
                                <button onClick={handleWhatsApp} className="bg-[#34c759] hover:bg-[#30be53] active:scale-[0.98] text-white font-medium text-sm px-5 py-2.5 rounded-full shadow-sm transition-all flex items-center gap-2">
                                    <span className="material-symbols-outlined text-base">chat</span>
                                    Open WhatsApp Chat
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function AdminApp() {
            const [isAuthenticated, setIsAuthenticated] = useState(() => {
                return localStorage.getItem("admin_authenticated") === "true";
            });
            const [loginEmail, setLoginEmail] = useState("");
            const [loginPass, setLoginPass] = useState("");
            const [loginError, setLoginError] = useState("");

            const handleLogin = (e) => {
                e.preventDefault();
                if (loginEmail.toLowerCase() === "zulak.ns@gmail.com" && loginPass === "@Xtechmax.com1") {
                    localStorage.setItem("admin_authenticated", "true");
                    setIsAuthenticated(true);
                } else {
                    setLoginError("Invalid credentials");
                }
            };

            const handleLogout = () => {
                localStorage.removeItem("admin_authenticated");
                setIsAuthenticated(false);
            };

            const [activeTab, setActiveTab] = useState("orders");
            
            const [orders, setOrders] = useState(() => {
                const saved = localStorage.getItem("admin_orders");
                return saved ? JSON.parse(saved) : [];
            });
            
            const [contactRequests, setContactRequests] = useState(() => {
                const saved = localStorage.getItem("admin_contact_requests");
                return saved ? JSON.parse(saved) : [];
            });
            
            const [pageviews, setPageviews] = useState(() => {
                const saved = localStorage.getItem("admin_pageviews");
                return saved ? JSON.parse(saved) : [];
            });

            const [loading, setLoading] = useState(true);
            const [supabaseStatus, setSupabaseStatus] = useState("Synced with Supabase");

            // Filters
            const [statusFilter, setStatusFilter] = useState("all");
            const [searchQuery, setSearchQuery] = useState("");
            const [rangePreset, setRangePreset] = useState("Last 7 Days");
            const [startDate, setStartDate] = useState("");
            const [endDate, setEndDate] = useState("");
            const [chartMetric, setChartMetric] = useState("revenue");
            const [selectedRows, setSelectedRows] = useState({});
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);

            // Fetch Real Data from Supabase
            const fetchSupabaseData = async () => {
                setLoading(true);
                try {
                    // Fetch Orders
                    const ordersResp = await fetch(`${SUPABASE_URL}/rest/v1/orders?select=*&order=created_at.desc`, {
                        headers: {
                            "apikey": SUPABASE_ANON_KEY,
                            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
                        }
                    });
                    if (ordersResp.ok) {
                        const supaOrders = await ordersResp.json();
                        if (Array.isArray(supaOrders)) {
                            const paidEmails = new Set();
                            const paidPhones = new Set();
                            
                            supaOrders.forEach(o => {
                                if (o.status === "paid") {
                                    if (o.email) paidEmails.add(o.email);
                                    if (o.phone) paidPhones.add(o.phone);
                                }
                            });
                            
                            const idsToPatch = [];
                            const processedOrders = supaOrders.map(o => {
                                const shouldBeConverted = (o.email && paidEmails.has(o.email)) || (o.phone && paidPhones.has(o.phone));
                                if (shouldBeConverted && o.followup_status !== "Converted") {
                                    idsToPatch.push(o.id);
                                    return { ...o, followup_status: "Converted" };
                                }
                                return o;
                            });
                            
                            if (idsToPatch.length > 0) {
                                const idList = idsToPatch.join(',');
                                fetch(`${SUPABASE_URL}/rest/v1/orders?id=in.(${idList})`, {
                                    method: "PATCH",
                                    headers: {
                                        "Content-Type": "application/json",
                                        "apikey": SUPABASE_ANON_KEY,
                                        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
                                    },
                                    body: JSON.stringify({ followup_status: "Converted" })
                                }).catch(err => console.error("Auto-convert patch error:", err));
                            }
                            
                            setOrders(processedOrders);
                        }
                    }

                    // Fetch Contact Requests
                    const contactResp = await fetch(`${SUPABASE_URL}/rest/v1/contact_requests?select=*&order=created_at.desc`, {
                        headers: {
                            "apikey": SUPABASE_ANON_KEY,
                            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
                        }
                    });
                    if (contactResp.ok) {
                        const supaContact = await contactResp.json();
                        if (Array.isArray(supaContact)) {
                            setContactRequests(supaContact);
                        }
                    }

                    // Fetch Pageviews
                    const pvResp = await fetch(`${SUPABASE_URL}/rest/v1/pageviews?select=*&order=created_at.desc&limit=5000`, {
                        headers: {
                            "apikey": SUPABASE_ANON_KEY,
                            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
                        }
                    });
                    if (pvResp.ok) {
                        const supaPv = await pvResp.json();
                        if (Array.isArray(supaPv)) {
                            setPageviews(supaPv);
                        }
                    }

                    setSupabaseStatus("Synced with Supabase");
                } catch (err) {
                    console.error("Supabase Fetch Error:", err);
                    setSupabaseStatus("Offline Mode (Local)");
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchSupabaseData();
            }, []);

            useEffect(() => {
                localStorage.setItem("admin_orders", JSON.stringify(orders));
            }, [orders]);
            
            useEffect(() => {
                localStorage.setItem("admin_pageviews", JSON.stringify(pageviews));
            }, [pageviews]);

            useEffect(() => {
                localStorage.setItem("admin_contact_requests", JSON.stringify(contactRequests));
            }, [contactRequests]);

            const viewerStats = useMemo(() => {
                const now = new Date();
                let live = 0, today = 0, month = 0, lifetime = pageviews.length;

                pageviews.forEach(pv => {
                    if (!pv.created_at) return;
                    const pvDate = new Date(pv.created_at);
                    const diffMs = now - pvDate;
                    const diffMins = diffMs / 60000;
                    
                    if (diffMins <= 5) live++;
                    
                    if (pvDate.getDate() === now.getDate() && pvDate.getMonth() === now.getMonth() && pvDate.getFullYear() === now.getFullYear()) {
                        today++;
                    }
                    
                    if (pvDate.getMonth() === now.getMonth() && pvDate.getFullYear() === now.getFullYear()) {
                        month++;
                    }
                });

                return { live, today, month, lifetime };
            }, [pageviews]);

            const analytics = useMemo(() => {
                const totalRev = orders.reduce((sum, o) => o.status === "paid" ? sum + Number(o.amount) : sum, 0);
                const totalOrd = orders.length;
                const paidOrd = orders.filter(o => o.status === "paid").length;
                const convRate = totalOrd > 0 ? ((paidOrd / totalOrd) * 100).toFixed(1) : "0.0";
                
                const todayStr = new Date().toLocaleDateString("en-GB", { day: '2-digit', month: 'short', year: 'numeric' });
                const todayOrders = orders.filter(o => (o.date || "").includes(todayStr));
                const todayRev = todayOrders.reduce((sum, o) => o.status === "paid" ? sum + Number(o.amount) : sum, 0);

                return {
                    totalRevenue: totalRev,
                    totalOrders: totalOrd,
                    paidOrders: paidOrd,
                    conversionRate: convRate,
                    todayRevenue: todayRev,
                    todayOrdersCount: todayOrders.length
                };
            }, [orders]);

            const chartData = useMemo(() => {
                if (orders.length === 0) {
                    return [
                        { date: "Day 1", Revenue: 0, Orders: 0 },
                        { date: "Day 2", Revenue: 0, Orders: 0 },
                        { date: "Day 3", Revenue: 0, Orders: 0 },
                        { date: "Day 4", Revenue: 0, Orders: 0 },
                        { date: "Day 5", Revenue: 0, Orders: 0 }
                    ];
                }
                const map = {};
                orders.forEach(o => {
                    const d = (o.date || "").split(",")[0] || "Unknown";
                    if (!map[d]) map[d] = { Revenue: 0, Orders: 0 };
                    map[d].Orders += 1;
                    if (o.status === "paid") map[d].Revenue += Number(o.amount);
                });
                return Object.keys(map).map(d => ({ date: d, ...map[d] }));
            }, [orders]);

            const dailyBreakdown = useMemo(() => {
                const map = {};
                orders.forEach(o => {
                    const d = (o.date || "").split(",")[0] || "Unknown";
                    if (!map[d]) map[d] = { date: d, orders: 0, paid: 0, revenue: 0 };
                    map[d].orders += 1;
                    if (o.status === "paid") {
                        map[d].paid += 1;
                        map[d].revenue += Number(o.amount);
                    }
                });
                return Object.values(map).map(item => ({
                    ...item,
                    conv: item.orders > 0 ? ((item.paid / item.orders) * 100).toFixed(1) + "%" : "0.0%"
                }));
            }, [orders]);

            const filteredOrders = useMemo(() => {
                return orders.filter(o => {
                    const matchesStatus = statusFilter === "all" || o.status === statusFilter;
                    const matchesSearch = !searchQuery || 
                        (o.email && o.email.toLowerCase().includes(searchQuery.toLowerCase())) || 
                        (o.phone && o.phone.includes(searchQuery));
                    return matchesStatus && matchesSearch;
                });
            }, [orders, statusFilter, searchQuery]);

            const handleFollowupChange = async (id, newStatus) => {
                const orderToChange = orders.find(o => o.id === id);
                if (!orderToChange) return;

                const { email, phone } = orderToChange;

                const matchingOrders = orders.filter(o => {
                    const matchEmail = email && o.email === email;
                    const matchPhone = phone && o.phone === phone;
                    return matchEmail || matchPhone;
                });
                
                const matchingIds = matchingOrders.map(o => o.id);

                setOrders(prev => prev.map(o => matchingIds.includes(o.id) ? { ...o, followup_status: newStatus } : o));

                try {
                    const idList = matchingIds.join(',');
                    await fetch(`${SUPABASE_URL}/rest/v1/orders?id=in.(${idList})`, {
                        method: "PATCH",
                        headers: {
                            "Content-Type": "application/json",
                            "apikey": SUPABASE_ANON_KEY,
                            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
                        },
                        body: JSON.stringify({ followup_status: newStatus })
                    });
                } catch (e) {
                    console.error("Supabase Patch Error:", e);
                }
            };

            const handleNoteChange = async (id, newNote) => {
                setOrders(prev => prev.map(o => o.id === id ? { ...o, followup_note: newNote } : o));

                try {
                    await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${id}`, {
                        method: "PATCH",
                        headers: {
                            "Content-Type": "application/json",
                            "apikey": SUPABASE_ANON_KEY,
                            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
                        },
                        body: JSON.stringify({ followup_note: newNote })
                    });
                } catch (e) {
                    console.error("Supabase Patch Error:", e);
                }
            };

            const toggleSelectAll = (e) => {
                if (e.target.checked) {
                    const allSelected = {};
                    filteredOrders.forEach(o => allSelected[o.id] = true);
                    setSelectedRows(allSelected);
                } else {
                    setSelectedRows({});
                }
            };

            const toggleSelectRow = (id) => {
                setSelectedRows(prev => ({ ...prev, [id]: !prev[id] }));
            };

            const handleDeleteSelected = async () => {
                const idsToDelete = Object.keys(selectedRows).filter(id => selectedRows[id]);
                if (idsToDelete.length === 0) return;
                
                if (!window.confirm(`Are you sure you want to delete ${idsToDelete.length} selected order(s)? This action cannot be undone.`)) {
                    return;
                }

                try {
                    const idList = idsToDelete.join(',');
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/orders?id=in.(${idList})`, {
                        method: "DELETE",
                        headers: {
                            "apikey": SUPABASE_ANON_KEY,
                            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
                        }
                    });

                    if (response.ok) {
                        setOrders(prev => prev.filter(o => !idsToDelete.includes(String(o.id))));
                        setSelectedRows({});
                    } else {
                        console.error("Failed to delete orders");
                        alert("Failed to delete orders from Supabase.");
                    }
                } catch (e) {
                    console.error("Delete error:", e);
                    alert("Error deleting orders.");
                }
            };

            const handleExportCSV = () => {
                if (!filteredOrders.length) {
                    alert("No orders available to export.");
                    return;
                }
                const headers = ["Order ID", "Date", "Email", "Phone", "Amount (INR)", "Status", "Addon", "Followup Status", "Followup Note", "Gateway Order ID", "Payment ID"];
                const rows = filteredOrders.map(o => [
                    o.id,
                    `"${new Date(o.created_at).toLocaleString('en-IN')}"`,
                    `"${o.email || ''}"`,

                                                                <td className="py-3.5 px-4 text-slate-800">{order.email}</td>
                                                                <td className="py-3.5 px-4 whitespace-nowrap font-mono">{order.phone}</td>
                                                                <td className="py-3.5 px-4 font-bold text-[#1d1d1f]">₹{order.amount}</td>
                                                                <td className="py-3.5 px-4 whitespace-nowrap">
                                                                    {(() => {
                                                                        if (!order.addon) return <span className="text-slate-400">—</span>;
                                                                        const text = String(order.addon);
                                                                        const hasEst = text.includes("Estimation") || text.includes("Master Construction");
                                                                        const hasVastu = text.includes("Vastu");
                                                                        
                                                                        if (hasEst && hasVastu) {
                                                                            return (
                                                                                <div className="inline-flex items-center gap-1" title={order.addon}>
                                                                                    <span className="bg-blue-500/10 text-[#0071e3] px-2 py-0.5 rounded-md font-bold text-[10px] border border-blue-500/20">EST</span>
                                                                                    <span className="text-slate-400 font-bold text-[10px]">+</span>
                                                                                    <span className="bg-purple-500/10 text-[#af52de] px-2 py-0.5 rounded-md font-bold text-[10px] border border-purple-500/20">VASTU</span>
                                                                                </div>
                                                                            );
                                                                        } else if (hasEst) {
                                                                            return (
                                                                                <span className="bg-blue-500/10 text-[#0071e3] px-2 py-0.5 rounded-md font-bold text-[10px] border border-blue-500/20" title={order.addon}>
                                                                                    EST
                                                                                </span>
                                                                            );
                                                                        } else if (hasVastu) {
                                                                            return (
                                                                                <span className="bg-purple-500/10 text-[#af52de] px-2 py-0.5 rounded-md font-bold text-[10px] border border-purple-500/20" title={order.addon}>
                                                                                    VASTU
                                                                                </span>
                                                                            );
                                                                        }
                                                                        return (
                                                                            <span className="bg-slate-200/50 text-slate-700 px-2 py-0.5 rounded-md font-medium text-[10px] border border-slate-300/40" title={order.addon}>
                                                                                {order.addon.length > 12 ? order.addon.slice(0, 10) + '..' : order.addon}
                                                                            </span>
                                                                        );
                                                                    })()}
                                                                </td>
                                                                <td className="py-3.5 px-4">
                                                                    {order.status === "paid" && (
                                                                        <span className="bg-emerald-500/10 text-[#34c759] border border-emerald-500/20 px-2.5 py-1 rounded-full font-semibold text-[11px] inline-flex items-center gap-1">
                                                                            <span className="w-1.5 h-1.5 rounded-full bg-[#34c759]"></span> Paid
                                                                        </span>
                                                                    )}
                                                                    {order.status === "pending" && (
                                                                        <span className="bg-amber-500/10 text-[#ff9500] border border-amber-500/20 px-2.5 py-1 rounded-full font-semibold text-[11px] inline-flex items-center gap-1">
                                                                            <span className="w-1.5 h-1.5 rounded-full bg-[#ff9500]"></span> Pending
                                                                        </span>
                                                                    )}
                                                                    {order.status === "failed" && (
                                                                        <span className="bg-rose-500/10 text-[#ff3b30] border border-rose-500/20 px-2.5 py-1 rounded-full font-semibold text-[11px] inline-flex items-center gap-1">
                                                                            <span className="w-1.5 h-1.5 rounded-full bg-[#ff3b30]"></span> Failed
                                                                        </span>
                                                                    )}
                                                                </td>
                                                                
                                                                {/* Follow-up Column */}
                                                                <td className="py-3.5 px-4 min-w-[160px]">
                                                                    <div className="flex flex-col gap-1">
                                                                        {(() => {
                                                                            const status = order.followup_status || "Not Contacted";
                                                                            let bgClass = "bg-slate-100 text-slate-700 border border-slate-200/80";
                                                                            if (status === "Interested") bgClass = "bg-[#0071e3] text-white font-semibold shadow-sm";
                                                                            if (status === "Converted") bgClass = "bg-[#34c759] text-white font-semibold shadow-sm";
                                                                            if (status === "Not Interested") bgClass = "bg-[#ff3b30] text-white font-semibold shadow-sm";
                                                                            if (status === "Other Issue") bgClass = "bg-[#af52de] text-white font-semibold shadow-sm";
                                                                            
                                                                            return (
                                                                                <select
                                                                                    value={status}
                                                                                    onChange={e => handleFollowupChange(order.id, e.target.value)}
                                                                                    className={`rounded-lg px-2.5 py-1 text-[11px] outline-none cursor-pointer apple-transition ${bgClass}`}
                                                                                    style={{ WebkitAppearance: 'none', appearance: 'none', textAlign: 'center', width: 'fit-content' }}
                                                                                >
                                                                                    <option value="Not Contacted" className="bg-white text-slate-900 font-normal">Not Contacted</option>
                                                                                    <option value="Interested" className="bg-white text-slate-900 font-normal">Interested</option>
                                                                                    <option value="Converted" className="bg-white text-slate-900 font-normal">Converted</option>
                                                                                    <option value="Not Interested" className="bg-white text-slate-900 font-normal">Not Interested</option>
                                                                                    <option value="Other Issue" className="bg-white text-slate-900 font-normal">Other Issue</option>
                                                                                </select>
                                                                            );
                                                                        })()}

                                                                        {order.followup_status === "Other Issue" && (
                                                                            <textarea
                                                                                rows="2"
                                                                                placeholder="Add note..."
                                                                                value={order.followup_note || ""}
                                                                                onChange={e => handleNoteChange(order.id, e.target.value)}
                                                                                className="mt-1 w-full apple-input rounded-lg p-2 text-[11px] text-slate-900"
                                                                            />
                                                                        )}
                                                                    </div>
                                                                </td>

                                                                {/* WhatsApp Button */}
                                                                <td className="py-3.5 px-4 whitespace-nowrap">
                                                                    {order.phone ? (
                                                                        <a
                                                                            href={waUrl}
                                                                            target="_blank"
                                                                            rel="noopener noreferrer"
                                                                            className="inline-flex items-center gap-1 bg-[#34c759] hover:bg-[#30be53] active:scale-[0.96] text-white font-medium px-3 py-1 rounded-xl text-xs shadow-sm transition-all"
                                                                        >
                                                                            <span className="material-symbols-outlined text-sm">chat</span>
                                                                            Message
                                                                        </a>
                                                                    ) : (
                                                                        <span className="text-slate-400">—</span>
                                                                    )}
                                                                </td>

                                                                {/* Call Button */}
                                                                <td className="py-3.5 px-4 whitespace-nowrap">
                                                                    {order.phone ? (
                                                                        <a
                                                                            href={`tel:${cleanPhone}`}
                                                                            className="inline-flex items-center gap-1 bg-[#0071e3] hover:bg-[#0077ed] active:scale-[0.96] text-white font-medium px-3 py-1 rounded-xl text-xs shadow-sm transition-all"
                                                                        >
                                                                            <span className="material-symbols-outlined text-sm">call</span>
                                                                            Call
                                                                        </a>
                                                                    ) : (
                                                                        <span className="text-slate-400">—</span>
                                                                    )}
                                                                </td>

                                                                {/* Gateway Order ID & Payment ID */}
                                                                <td className="py-3.5 px-4 font-mono text-[11px] text-slate-400">{order.gateway_order_id}</td>
                                                                <td className="py-3.5 px-4 font-mono text-[11px] text-slate-400">{order.payment_id || "—"}</td>
                                                            </tr>
                                                        );
                                                    })
                                                ) : (
                                                    <tr>
                                                        <td colSpan="12" className="py-12 text-center text-slate-400">
                                                            <span className="material-symbols-outlined text-4xl block mb-2 opacity-50">shopping_bag</span>
                                                            No orders found. New customer orders will appear here automatically from Supabase.
                                                        </td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Analytics Page */}
                        {activeTab === "analytics" && (
                            <div className="space-y-7">
                                <div className="flex justify-between items-center">
                                    <div>
                                        <h1 className="text-2xl font-bold text-[#1d1d1f] tracking-tight">Traffic & Analytics</h1>
                                        <p className="text-xs text-slate-500 mt-0.5">Real-time visitor counts and landing page traffic logs</p>
                                    </div>
                                    <button onClick={fetchSupabaseData} className="flex items-center gap-1.5 px-3.5 py-2 bg-[#0071e3] text-white rounded-xl text-xs font-semibold hover:bg-[#0077ed] shadow-sm shadow-blue-500/20 apple-transition active:scale-[0.98]">
                                        <span className="material-symbols-outlined text-base">refresh</span>
                                        Refresh Data
                                    </button>
                                </div>

                                {/* Viewer Analytics Cards */}
                                <div>
                                    <div className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 px-1">Live Visitor Stats</div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                                        <div className="glass-card rounded-2xl p-5 relative overflow-hidden apple-transition">
                                            <div className="text-xs text-slate-500 font-medium flex items-center gap-2">
                                                <span className="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse"></span>
                                                Live Viewers Now
                                            </div>
                                            <div className="text-3xl font-bold text-[#1d1d1f] mt-2">{viewerStats.live}</div>
                                            <div className="text-[11px] text-slate-400 mt-1">Active in last 5 minutes</div>
                                        </div>

                                        <div className="glass-card rounded-2xl p-5 apple-transition">
                                            <div className="text-xs text-slate-500 font-medium">Today's Viewers</div>
                                            <div className="text-3xl font-bold text-[#1d1d1f] mt-2">{viewerStats.today}</div>
                                        </div>

                                        <div className="glass-card rounded-2xl p-5 apple-transition">
                                            <div className="text-xs text-slate-500 font-medium">This Month</div>
                                            <div className="text-3xl font-bold text-[#1d1d1f] mt-2">{viewerStats.month}</div>
                                        </div>

                                        <div className="glass-card rounded-2xl p-5 apple-transition">
                                            <div className="text-xs text-slate-500 font-medium">Lifetime Views</div>
                                            <div className="text-3xl font-bold text-[#1d1d1f] mt-2">{viewerStats.lifetime}</div>
                                        </div>
                                    </div>
                                </div>

                                {/* Recent Viewers Table */}
                                <div className="glass-card rounded-3xl overflow-hidden shadow-sm">
                                    <div className="px-6 py-4 border-b border-slate-200/60 font-semibold text-[#1d1d1f] text-sm">
                                        Recent Page Viewers Log
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm text-slate-600">
                                            <thead className="bg-slate-100/60 text-slate-400 font-semibold text-[11px] uppercase tracking-wider border-b border-slate-200/60">
                                                <tr>
                                                    <th className="py-3.5 px-6 w-48">Timestamp</th>
                                                    <th className="py-3.5 px-6">User Agent / Device Information</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-200/40">
                                                {pageviews.slice(0, 50).map((pv, idx) => (
                                                    <tr key={pv.id || idx} className="hover:bg-blue-50/30 apple-transition">
                                                        <td className="py-3.5 px-6 whitespace-nowrap text-xs font-mono text-slate-500">
                                                            {new Date(pv.created_at).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' })}
                                                        </td>
                                                        <td className="py-3.5 px-6">
                                                            <div className="text-xs text-slate-600 truncate max-w-[600px]" title={pv.user_agent || "Unknown Device"}>
                                                                {pv.user_agent || "Unknown Device"}
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ))}
                                                {pageviews.length === 0 && (
                                                    <tr>
                                                        <td colSpan="2" className="py-12 text-center text-slate-400">
                                                            <span className="material-symbols-outlined text-4xl block mb-2 opacity-50">insights</span>
                                                            No viewer data available.
                                                        </td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Contact Requests Page */}
                        {activeTab === "contact" && (
                            <div className="space-y-6">
                                <div>
                                    <h1 className="text-2xl font-bold text-[#1d1d1f] tracking-tight">Contact Requests</h1>
                                    <p className="text-xs text-slate-500 mt-0.5">Form submissions received from customer inquiry forms</p>
                                </div>
                                <div className="glass-card rounded-3xl overflow-hidden shadow-sm">
                                    <table className="w-full text-left text-sm text-slate-600">
                                        <thead className="bg-slate-100/60 text-slate-400 font-semibold text-[11px] uppercase tracking-wider border-b border-slate-200/60">
                                            <tr>
                                                <th className="py-3.5 px-6">Date</th>
                                                <th className="py-3.5 px-6">Name</th>
                                                <th className="py-3.5 px-6">Email</th>
                                                <th className="py-3.5 px-6">Subject</th>
                                                <th className="py-3.5 px-6">Message</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-200/40">
                                            {contactRequests.length > 0 ? (
                                                contactRequests.map(req => (
                                                    <tr key={req.id} className="hover:bg-blue-50/30 apple-transition">
                                                        <td className="py-4 px-6 text-xs text-slate-500 whitespace-nowrap">{req.date}</td>
                                                        <td className="py-4 px-6 font-semibold text-[#1d1d1f]">{req.name}</td>
                                                        <td className="py-4 px-6 text-[#0071e3] font-medium">{req.email}</td>
                                                        <td className="py-4 px-6 font-medium text-slate-800">{req.subject}</td>
                                                        <td className="py-4 px-6 text-slate-600 text-xs max-w-md">{req.message}</td>
                                                    </tr>
                                                ))
                                            ) : (
                                                <tr>
                                                    <td colSpan="5" className="py-12 text-center text-slate-400">
                                                        <span className="material-symbols-outlined text-4xl block mb-2 opacity-50">mail</span>
                                                        No contact requests yet. Submissions from contact form will appear here.
                                                    </td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* Manual Send Page */}
                        {activeTab === "manual" && (
                            <ManualSendView />
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<AdminApp />);
    </script>
</body>
</html>
